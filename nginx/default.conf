server {
    listen 80;

    # Static frontend
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API -> FastAPI backend container
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 50M;  # allow reasonably large FASTA/PDB uploads
    }

    # Bulk downloads served directly from the data volume (no need to
    # round-trip through the API for static files)
    location /downloads/ {
        alias /data/downloads/;
        autoindex off;
    }

    # Explore: statically-rendered EVADES protein browser (generated from
    # anti_defence-main via generator/export_static.py — see
    # generator/README.md). Every page and blob is a real file at
    # <path>/index.html, so no fallback/rewrite is needed — a missing
    # page is a genuine 404.
    location /explore/ {
        try_files $uri $uri/index.html =404;
    }
}
