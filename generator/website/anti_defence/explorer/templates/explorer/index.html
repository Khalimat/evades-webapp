{% extends "explorer/base.html" %}
{% load static %}
{% block content %}

<section class="vf-content | vf-stack vf-stack--600">
    <p>Number of currently hosted <b>anti-defence mechanism proteins:</b> {{ num_proteins }}</p>

    <form 
        onsubmit="event.preventDefault(); redirectToDetails();"
        class="vf-form vf-form--search vf-form--search--mini">
        <label for="protein-id-input" class="vf-form__label">Enter protein ID:</label>
        <input type="text" id="protein-id-input" name="protein_id" class="vf-form__input plp-input" required>
        <input type="submit" value="Go to Details" class="vf-button vf-button--primary">
        <a href="{% url 'protein_list' %}" class="vf-button vf-button--secondary">View available Proteins</a>
        <button type="button" onclick="populateExample()" class="vf-button">Example</button>
    </form>

    <!-- Display error messages -->
    {% if messages %}
        {% for message in messages %}
            <p style="color: red;">{{ message }}</p>
        {% endfor %}
    {% endif %}
</section>

<script>
    function populateExample() {
        document.getElementById("protein-id-input").value = "{{ first_id }}";
    }

    function redirectToDetails() {
        const id = document.getElementById("protein-id-input").value.trim();
        if (id) {
            const detailsUrl = "{% url 'details' 'PROTID' %}".replace("PROTID", encodeURIComponent(id));
            window.location.href = detailsUrl;
        }
    }
</script>

{% endblock content %}
